name: Test testflight increment-build-number validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          project-path: "MyApp.xcodeproj"
          code-signing-identity: "iOS Distribution"
          team-id: "ABCDEF1234"
          # Provide p12 and mobileprovision so those validations pass
          p12-base64: "ZmFrZXA0Mg=="
          mobileprovision-base64: "ZmFrZW1vYmlsZXByb3Zpc2lvbg=="
          # Set increment-build-number to testflight without required API key inputs
          increment-build-number: "testflight"
          # Missing: bundle-identifier, app-store-connect-api-key-id,
          #          app-store-connect-api-key-issuer-id, app-store-connect-api-key-base64
      - name: Assert action failed due to missing testflight API key inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when testflight increment requires missing API key inputs"
