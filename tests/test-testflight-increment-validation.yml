name: Test testflight increment-build-number validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with testflight increment but missing API keys (expect failure)
        id: action
        uses: .
        with:
          project-path: "MyApp.xcodeproj"
          code-signing-identity: "iOS Distribution"
          team-id: "TEAMID123"
          p12-base64: "ZmFrZXAxMg=="
          mobileprovision-base64: "ZmFrZW1wZg=="
          increment-build-number: "testflight"
        continue-on-error: true

      - name: Assert action failed with testflight validation error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail due to missing testflight API key inputs, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when testflight increment-build-number was set without required API key inputs"
