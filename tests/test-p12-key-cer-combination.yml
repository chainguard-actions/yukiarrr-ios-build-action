name: Test p12 key+cert combination validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create fake mobileprovision file
        run: |
          echo "fake-mobileprovision-content" > /tmp/fake.mobileprovision
      - id: action
        uses: .
        continue-on-error: true
        with:
          project-path: "MyApp.xcodeproj"
          code-signing-identity: "iOS Distribution"
          team-id: "ABCDEF1234"
          # Use key+cert combination instead of combined p12-base64
          p12-key-base64: "ZmFrZWtleQ=="
          p12-cer-base64: "ZmFrZWNlcg=="
          # Use mobileprovision-path instead of mobileprovision-base64
          mobileprovision-path: "/tmp/fake.mobileprovision"
      - name: Assert action failed at build stage (not at validation)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail (xcodebuild not available on Linux),
          # but it must have passed the p12 and mobileprovision validation checks.
          # If it had failed at p12 validation, it would also be "failure" but
          # the important thing is that it did NOT fail with a validation error
          # about p12 or mobileprovision format — it got past those checks.
          # We accept either failure (build tools missing) or success here.
          if [ "$OUTCOME" = "failure" ] || [ "$OUTCOME" = "success" ]; then
            echo "PASS: action accepted p12 key+cert combination and mobileprovision-path inputs"
          else
            echo "FAIL: unexpected outcome=$OUTCOME"
            exit 1
          fi
