name: Test p12-key-path, p12-cer-path, p12-path, and mobileprovision-path inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create dummy signing files
        run: |
          echo "dummy-p12-key-content" > /tmp/dummy.p12.key
          echo "dummy-p12-cer-content" > /tmp/dummy.p12.cer
          echo "dummy-p12-content" > /tmp/dummy.p12
          echo "dummy-mobileprovision-content" > /tmp/dummy.mobileprovision

      - id: action-key-cer-path
        uses: .
        continue-on-error: true
        with:
          project-path: "MyApp.xcodeproj"
          code-signing-identity: "iPhone Distribution"
          team-id: "ABCDE12345"
          p12-key-path: "/tmp/dummy.p12.key"
          p12-cer-path: "/tmp/dummy.p12.cer"
          mobileprovision-path: "/tmp/dummy.mobileprovision"
          certificate-password: "test-password"
          export-method: "app-store"

      - name: Assert action ran with p12-key-path and p12-cer-path inputs
        env:
          OUTCOME: ${{ steps.action-key-cer-path.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action is expected to fail in a Linux environment without Xcode/macOS tools.
          # We verify it ran (outcome is either 'success' or 'failure', not 'skipped' or empty).
          if [ "$OUTCOME" = "skipped" ] || [ -z "$OUTCOME" ]; then
            echo "FAIL: action did not run at all (outcome=$OUTCOME)"
            exit 1
          fi
          echo "PASS: action ran with p12-key-path and p12-cer-path inputs, outcome=$OUTCOME (failure expected in non-macOS env)"

      - id: action-p12-path
        uses: .
        continue-on-error: true
        with:
          project-path: "MyApp.xcodeproj"
          code-signing-identity: "iPhone Distribution"
          team-id: "ABCDE12345"
          p12-path: "/tmp/dummy.p12"
          mobileprovision-path: "/tmp/dummy.mobileprovision"
          certificate-password: "test-password"
          export-method: "app-store"

      - name: Assert action ran with p12-path input
        env:
          OUTCOME: ${{ steps.action-p12-path.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action is expected to fail in a Linux environment without Xcode/macOS tools.
          # We verify it ran (outcome is either 'success' or 'failure', not 'skipped' or empty).
          if [ "$OUTCOME" = "skipped" ] || [ -z "$OUTCOME" ]; then
            echo "FAIL: action did not run at all (outcome=$OUTCOME)"
            exit 1
          fi
          echo "PASS: action ran with p12-path input, outcome=$OUTCOME (failure expected in non-macOS env)"
