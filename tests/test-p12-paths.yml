name: Test with p12-key-path, p12-cer-path, p12-path, and mobileprovision-path inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create dummy p12 key, cert, p12, and mobileprovision files
        run: |
          echo "dummy-p12-key-content" > /tmp/dummy.p12key
          echo "dummy-p12-cer-content" > /tmp/dummy.cer
          echo "dummy-p12-content" > /tmp/dummy.p12
          echo "dummy-mobileprovision-content" > /tmp/dummy.mobileprovision
      - id: action-paths
        uses: .
        continue-on-error: true
        with:
          p12-key-path: "/tmp/dummy.p12key"
          p12-cer-path: "/tmp/dummy.cer"
          p12-path: "/tmp/dummy.p12"
          mobileprovision-path: "/tmp/dummy.mobileprovision"
          project-path: "MyApp.xcodeproj"
          code-signing-identity: "iPhone Distribution"
          team-id: "ABCDE12345"
          export-method: "development"
          configuration: "Release"
          output-path: "output.ipa"
          certificate-password: ""
      - name: Assert action ran (expected to fail on Linux without Xcode)
        env:
          OUTCOME: ${{ steps.action-paths.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # On Linux, xcodebuild is not available, so the action should fail.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected (no Xcode on Linux)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded unexpectedly"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
