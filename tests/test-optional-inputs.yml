name: Test optional inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          project-path: "MyApp.xcodeproj"
          code-signing-identity: "iPhone Distribution"
          team-id: "ABCDE12345"
          export-method: "ad-hoc"
          configuration: "Debug"
          output-path: "output/MyApp.ipa"
          scheme: "MyApp"
          update-targets: "MyApp"
          increment-build-number: "1"
          bundle-identifier: "com.example.myapp"

      - name: Assert action ran with optional inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action is expected to fail in a Linux environment without Xcode/macOS tools.
          # We verify it ran (outcome is either 'success' or 'failure', not 'skipped' or empty).
          if [ "$OUTCOME" = "skipped" ] || [ -z "$OUTCOME" ]; then
            echo "FAIL: action did not run at all (outcome=$OUTCOME)"
            exit 1
          fi
          echo "PASS: action ran with optional inputs, outcome=$OUTCOME (failure expected in non-macOS env)"
