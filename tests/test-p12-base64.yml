name: Test p12-base64 signing credential input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create dummy base64 values
        run: |
          echo "DUMMY_P12=$(echo 'dummy-p12-content' | base64)" >> $GITHUB_ENV
          echo "DUMMY_PROV=$(echo 'dummy-mobileprovision-content' | base64)" >> $GITHUB_ENV

      - id: action
        uses: .
        continue-on-error: true
        with:
          project-path: "MyApp.xcodeproj"
          code-signing-identity: "iPhone Distribution"
          team-id: "ABCDE12345"
          p12-base64: ${{ env.DUMMY_P12 }}
          mobileprovision-base64: ${{ env.DUMMY_PROV }}
          certificate-password: "test-password"
          export-method: "app-store"

      - name: Assert action ran with p12-base64 input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action is expected to fail in a Linux environment without Xcode/macOS tools.
          # We verify it ran (outcome is either 'success' or 'failure', not 'skipped' or empty).
          if [ "$OUTCOME" = "skipped" ] || [ -z "$OUTCOME" ]; then
            echo "FAIL: action did not run at all (outcome=$OUTCOME)"
            exit 1
          fi
          echo "PASS: action ran with p12-base64 input, outcome=$OUTCOME (failure expected in non-macOS env)"
