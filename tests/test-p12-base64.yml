name: Test with p12-base64 combined certificate input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create dummy base64 p12 and mobileprovision
        run: |
          # Create minimal dummy files encoded as base64 for input testing
          echo "dummy-p12-content" | base64 > /tmp/dummy_p12_b64.txt
          echo "dummy-mobileprovision-content" | base64 > /tmp/dummy_mp_b64.txt
          echo "P12_BASE64=$(cat /tmp/dummy_p12_b64.txt)" >> $GITHUB_ENV
          echo "MP_BASE64=$(cat /tmp/dummy_mp_b64.txt)" >> $GITHUB_ENV
      - id: action
        uses: .
        continue-on-error: true
        with:
          p12-base64: ${{ env.P12_BASE64 }}
          mobileprovision-base64: ${{ env.MP_BASE64 }}
          project-path: "MyApp.xcodeproj"
          code-signing-identity: "iPhone Distribution"
          team-id: "ABCDE12345"
          export-method: "ad-hoc"
          configuration: "Release"
          output-path: "output.ipa"
          certificate-password: ""
      - name: Assert action ran (expected to fail on Linux without Xcode)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # On Linux, xcodebuild is not available, so the action should fail.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected (no Xcode on Linux)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded unexpectedly"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
