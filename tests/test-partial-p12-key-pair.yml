name: Test partial p12 key pair (key without cert)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          project-path: "MyApp.xcodeproj"
          code-signing-identity: "iOS Distribution"
          team-id: "ABCDE12345"
          # Only provide p12-key-base64 without p12-cer-base64 — incomplete pair
          p12-key-base64: "ZmFrZXA0Mg=="
          # p12-cer-base64 intentionally omitted
          # No mobileprovision either
      - name: Assert action failed due to incomplete p12 key pair
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when p12 key pair is incomplete"
