name: Test incomplete p12 key-only (missing cert) validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          project-path: "MyApp.xcodeproj"
          code-signing-identity: "iOS Distribution"
          team-id: "TEAMID123"
          # Provide only p12-key-base64 without p12-cer-base64 — incomplete pair
          # This should still fail p12 validation since both are required together
          p12-key-base64: "ZHVtbXk="
          # p12-cer-base64 intentionally omitted
          mobileprovision-base64: "ZHVtbXk="
      - name: Assert action failed with p12 validation error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail due to incomplete p12 key+cert pair"
            exit 1
          fi
          echo "PASS: action correctly failed when only p12-key-base64 is provided without p12-cer-base64"
