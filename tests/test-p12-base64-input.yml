name: Test iOS Build Action - p12-base64 input path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create dummy project path
        run: mkdir -p /tmp/dummy-project

      - name: Create dummy mobileprovision base64
        id: dummy-inputs
        run: |
          # Create minimal dummy base64 values (not real certs, just to test input handling)
          DUMMY_P12=$(echo "dummy-p12-content" | base64)
          DUMMY_PROV=$(echo "dummy-mobileprovision-content" | base64)
          echo "p12=$DUMMY_P12" >> $GITHUB_OUTPUT
          echo "prov=$DUMMY_PROV" >> $GITHUB_OUTPUT

      - id: action
        uses: .
        continue-on-error: true
        with:
          project-path: /tmp/dummy-project/App.xcodeproj
          code-signing-identity: "iPhone Distribution"
          team-id: "ABCDEF1234"
          p12-base64: ${{ steps.dummy-inputs.outputs.p12 }}
          mobileprovision-base64: ${{ steps.dummy-inputs.outputs.prov }}
          certificate-password: ""
          export-method: app-store
          configuration: Release
          output-path: /tmp/output.ipa

      - name: Assert action failed (no Xcode available)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail without Xcode, but got outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when Xcode is not available (p12-base64 path)"
