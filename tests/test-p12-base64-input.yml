name: Test p12-base64 combined input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Test action with p12-base64 combined input fails on missing project
        id: action
        uses: .
        with:
          p12-base64: "ZmFrZXAxMmRhdGE="
          mobileprovision-base64: "ZmFrZW1vYmlsZXByb3Zpc2lvbg=="
          project-path: "nonexistent/App.xcodeproj"
          code-signing-identity: "iPhone Distribution"
          team-id: "FAKETEAMID"
          export-method: "ad-hoc"
          configuration: "Release"
          certificate-password: ""
        continue-on-error: true
      - name: Assert action failed due to missing project
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when project path does not exist, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when project path does not exist"
