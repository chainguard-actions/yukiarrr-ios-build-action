name: Test with workspace and scheme inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          project-path: "MyApp.xcodeproj"
          workspace-path: "MyApp.xcworkspace"
          scheme: "MyApp"
          code-signing-identity: "iPhone Distribution"
          team-id: "ABCDE12345"
          export-method: "enterprise"
          configuration: "Release"
          output-path: "build/MyApp.ipa"
          update-targets: "MyApp"
      - name: Assert action ran (expected to fail on Linux without Xcode)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # On Linux, xcodebuild is not available, so the action should fail.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected (no Xcode on Linux)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded unexpectedly"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
