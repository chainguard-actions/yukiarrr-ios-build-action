name: Test p12-path and mobileprovision-path inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fake p12 and mobileprovision files
        run: |
          echo "fakep12data" > /tmp/fake.p12
          echo "fakemobileprovisiondata" > /tmp/fake.mobileprovision

      - name: Run action with p12-path and mobileprovision-path inputs
        id: action
        uses: .
        with:
          p12-path: "/tmp/fake.p12"
          mobileprovision-path: "/tmp/fake.mobileprovision"
          project-path: "nonexistent/App.xcodeproj"
          code-signing-identity: "iOS Distribution"
          team-id: "FAKETEAMID"
          export-method: "ad-hoc"
          configuration: "Release"
        continue-on-error: true

      - name: Assert action failed (no real Xcode project)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when project path does not exist, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when project path does not exist (p12-path and mobileprovision-path inputs were accepted)"
