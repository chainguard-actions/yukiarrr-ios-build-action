name: Test missing mobileprovision inputs error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          project-path: "MyApp.xcodeproj"
          code-signing-identity: "iOS Distribution"
          team-id: "ABCDEF1234"
          p12-base64: "dGVzdA=="
          # No mobileprovision inputs provided — should fail with "mobileprovision missing or in the wrong format."
      - name: Assert action failed with mobileprovision error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail due to missing mobileprovision inputs, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when mobileprovision inputs are missing"
