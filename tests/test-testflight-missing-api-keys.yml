name: Test testflight increment-build-number missing API keys error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          project-path: "MyApp.xcodeproj"
          code-signing-identity: "iOS Distribution"
          team-id: "ABCDEF1234"
          p12-base64: "dGVzdA=="
          mobileprovision-base64: "dGVzdA=="
          increment-build-number: "testflight"
          # Missing bundle-identifier, app-store-connect-api-key-id,
          # app-store-connect-api-key-issuer-id, and app-store-connect-api-key-base64
      - name: Assert action failed with testflight API key error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when testflight is set without API keys, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when testflight increment-build-number is set without required API keys"
