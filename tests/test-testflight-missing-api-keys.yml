name: Test testflight increment-build-number missing API keys
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          project-path: "MyApp.xcodeproj"
          code-signing-identity: "iOS Distribution"
          team-id: "ABCDE12345"
          # Provide p12 and mobileprovision so those validations pass
          p12-base64: "ZmFrZXA0Mg=="
          mobileprovision-base64: "ZmFrZW1vYmlsZXByb3Zpc2lvbg=="
          # Request testflight build number increment but omit required API key fields
          increment-build-number: "testflight"
          # bundle-identifier, app-store-connect-api-key-id, etc. intentionally omitted
      - name: Assert action failed due to missing testflight API key fields
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when testflight API key fields are missing"
