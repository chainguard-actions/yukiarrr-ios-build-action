name: Test p12-cer-base64 input (key + cert pair via base64)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          project-path: "MyApp.xcodeproj"
          code-signing-identity: "iOS Distribution"
          team-id: "ABCDE12345"
          # Provide both p12-key-base64 and p12-cer-base64 (the split key+cert pair)
          p12-key-base64: "ZmFrZXA0Mg=="
          p12-cer-base64: "ZmFrZWNlcg=="
          # Also provide mobileprovision-base64 so p12 validation passes
          mobileprovision-base64: "ZmFrZW1vYmlsZXByb3Zpc2lvbg=="
      - name: Assert action failed (no real Xcode environment)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (no real Xcode environment), but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when using p12-key-base64 + p12-cer-base64 pair without a real Xcode environment"
