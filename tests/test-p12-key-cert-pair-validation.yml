name: Test p12 key and cert pair validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          project-path: "MyApp.xcodeproj"
          code-signing-identity: "iOS Distribution"
          team-id: "TEAMID123"
          # Provide p12 as separate key + cert base64 pair (both required)
          p12-key-base64: "ZHVtbXk="
          p12-cer-base64: "ZHVtbXk="
          # No mobileprovision — action should fail at mobileprovision validation,
          # NOT at p12 validation, confirming the key+cert pair was accepted
      - name: Assert action failed at mobileprovision step (not p12 step)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (at mobileprovision validation)"
            exit 1
          fi
          echo "PASS: action correctly accepted p12 key+cert pair and failed at mobileprovision validation"
