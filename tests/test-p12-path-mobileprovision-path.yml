name: Test p12-path and mobileprovision-path inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create dummy p12 and mobileprovision files
        run: |
          echo "dummy-p12-content" > /tmp/dummy.p12
          echo "dummy-mobileprovision-content" > /tmp/dummy.mobileprovision
      - name: Run action with p12-path and mobileprovision-path inputs
        id: action
        uses: .
        continue-on-error: true
        with:
          p12-path: /tmp/dummy.p12
          mobileprovision-path: /tmp/dummy.mobileprovision
          project-path: MyApp.xcodeproj
          code-signing-identity: "iPhone Distribution"
          team-id: "ABCDE12345"
          export-method: ad-hoc
          configuration: Release
      - name: Assert action ran (expected to fail without Xcode)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action is expected to fail since there is no Xcode/iOS environment
          # but we verify it was invoked (not skipped) and inputs were accepted
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action ran with p12-path and mobileprovision-path inputs"
