name: Test missing mobileprovision validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          project-path: "MyApp.xcodeproj"
          code-signing-identity: "iOS Distribution"
          team-id: "ABCDE12345"
          # Provide a dummy p12-base64 so P12 validation passes
          p12-base64: "dGVzdA=="
          # No mobileprovision input — should trigger mobileprovision validation error
      - name: Assert action failed with mobileprovision validation error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail due to missing mobileprovision, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when mobileprovision was missing"
