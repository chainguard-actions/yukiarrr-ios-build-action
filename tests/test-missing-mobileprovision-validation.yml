name: Test missing mobileprovision validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          project-path: "MyApp.xcodeproj"
          code-signing-identity: "iOS Distribution"
          team-id: "TEAMID123"
          # Provide p12 as base64 (a dummy value to pass p12 validation)
          p12-base64: "ZHVtbXk="
          # No mobileprovision provided — should trigger mobileprovision validation error
      - name: Assert action failed with mobileprovision error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail due to missing mobileprovision"
            exit 1
          fi
          echo "PASS: action correctly failed when mobileprovision is missing"
