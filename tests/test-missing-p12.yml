name: Test missing p12 inputs error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          project-path: "MyApp.xcodeproj"
          code-signing-identity: "iOS Distribution"
          team-id: "ABCDEF1234"
          # No p12 inputs provided — should fail with "P12 keys missing or in the wrong format."
          mobileprovision-base64: "dGVzdA=="
      - name: Assert action failed with p12 error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail due to missing p12 inputs, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when p12 inputs are missing"
