name: Test testflight increment-build-number missing API keys validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          project-path: "MyApp.xcodeproj"
          code-signing-identity: "iOS Distribution"
          team-id: "TEAMID123"
          # Provide p12 and mobileprovision to pass those validations
          p12-base64: "ZHVtbXk="
          mobileprovision-base64: "ZHVtbXk="
          # Set increment-build-number to testflight without providing required API keys
          increment-build-number: "testflight"
          # Missing: bundle-identifier, app-store-connect-api-key-id,
          #          app-store-connect-api-key-issuer-id, app-store-connect-api-key-base64
      - name: Assert action failed with testflight API keys error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail due to missing testflight API keys"
            exit 1
          fi
          echo "PASS: action correctly failed when testflight API keys are missing"
