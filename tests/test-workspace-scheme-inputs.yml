name: Test iOS Build Action - workspace and scheme inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create dummy project and workspace paths
        run: |
          mkdir -p /tmp/dummy-project
          mkdir -p /tmp/dummy-workspace

      - id: action
        uses: .
        continue-on-error: true
        with:
          project-path: /tmp/dummy-project/App.xcodeproj
          workspace-path: /tmp/dummy-workspace/App.xcworkspace
          scheme: MyAppScheme
          code-signing-identity: "iPhone Distribution"
          team-id: "ABCDEF1234"
          export-method: ad-hoc
          configuration: Debug
          output-path: /tmp/output.ipa
          update-targets: "MyApp MyAppExtension"

      - name: Assert action failed (no Xcode available)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail without Xcode, but got outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when Xcode is not available (workspace+scheme path)"
