name: Test p12-path and mobileprovision-path inputs accepted
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          project-path: "MyApp.xcodeproj"
          code-signing-identity: "iOS Distribution"
          team-id: "ABCDEF1234"
          # Using path-based inputs instead of base64
          p12-path: "/tmp/cert.p12"
          mobileprovision-path: "/tmp/app.mobileprovision"
      - name: Assert action did NOT fail with p12 or mobileprovision validation error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should pass both p12 and mobileprovision validation when path inputs are provided.
          # On Linux (no Xcode), build.sh will fail — that is expected and acceptable.
          # The key assertion: validation passed (action proceeded past input validation).
          echo "PASS: action ran with p12-path and mobileprovision-path inputs (outcome=$OUTCOME, validation passed)"
