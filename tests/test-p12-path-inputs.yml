name: Test p12 path-based inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          project-path: "MyApp.xcodeproj"
          code-signing-identity: "iOS Distribution"
          team-id: "ABCDE12345"
          # Use path-based p12 inputs (key + cert pair via paths)
          p12-key-path: "/tmp/fake.p12key"
          p12-cer-path: "/tmp/fake.cer"
          # Also provide p12-path (combined p12 file via path)
          p12-path: "/tmp/fake.p12"
          # Provide mobileprovision-path as well
          mobileprovision-path: "/tmp/fake.mobileprovision"
      - name: Assert action failed (no real Xcode/files available)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (no real Xcode or certificate files), but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when path-based p12/mobileprovision inputs point to non-existent files"
