name: Test missing project path error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Test action fails when project does not exist
        id: action
        uses: .
        with:
          project-path: "nonexistent/App.xcodeproj"
          code-signing-identity: "iPhone Distribution"
          team-id: "FAKETEAMID"
          export-method: "app-store"
          configuration: "Release"
        continue-on-error: true
      - name: Assert action failed due to missing project
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when project path does not exist, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when project path does not exist"
