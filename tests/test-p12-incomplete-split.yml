name: Test incomplete p12 split inputs fail validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          project-path: "MyApp.xcodeproj"
          code-signing-identity: "iOS Distribution"
          team-id: "ABCDEF1234"
          # Only p12-key-base64 provided, missing p12-cer-base64 — should fail validation
          p12-key-base64: "dGVzdA=="
          mobileprovision-base64: "dGVzdA=="
      - name: Assert action failed with p12 validation error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when only p12-key-base64 is provided without p12-cer-base64, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when p12 split inputs are incomplete (key without cert)"
