name: Test p12-key-path and p12-cer-path inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create dummy p12 key and certificate files
        run: |
          echo "dummy-key" > /tmp/dummy.p12key
          echo "dummy-cert" > /tmp/dummy.cer
          echo "dummy-mobileprovision" > /tmp/dummy.mobileprovision
      - name: Run action with p12-key-path and p12-cer-path inputs
        id: action
        uses: .
        continue-on-error: true
        with:
          p12-key-path: /tmp/dummy.p12key
          p12-cer-path: /tmp/dummy.cer
          mobileprovision-path: /tmp/dummy.mobileprovision
          project-path: MyApp.xcodeproj
          code-signing-identity: "iPhone Distribution"
          team-id: "ABCDE12345"
          export-method: development
          configuration: Debug
      - name: Assert action ran (expected to fail without Xcode)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action is expected to fail since there is no Xcode/iOS environment
          # but we verify it was invoked (not skipped) and inputs were accepted
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action ran with p12-key-path and p12-cer-path inputs"
