name: Test basic invocation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          project-path: "MyApp.xcodeproj"
          code-signing-identity: "iPhone Distribution"
          team-id: "ABCDE12345"

      - name: Assert action ran (expected to fail without Xcode)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action is expected to fail in a Linux environment without Xcode/macOS tools.
          # We verify it ran (outcome is either 'success' or 'failure', not 'skipped' or empty).
          if [ "$OUTCOME" = "skipped" ] || [ -z "$OUTCOME" ]; then
            echo "FAIL: action did not run at all (outcome=$OUTCOME)"
            exit 1
          fi
          echo "PASS: action ran with outcome=$OUTCOME (failure expected in non-macOS env)"
